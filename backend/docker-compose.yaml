services:
  postgres:
    image: postgres:16-alpine # or latest stable postgres version
    container_name: task-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: task_tracker
      POSTGRES_PASSWORD: task_tracker
      POSTGRES_DB: task_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U task_tracker -d task_tracker" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: